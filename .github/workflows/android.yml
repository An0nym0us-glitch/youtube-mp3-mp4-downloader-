name: Build Android APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: yt-downloader-apks
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Every push (not PRs) publishes a release, so the APK is one tap away on a phone.
      - name: Publish GitHub release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('YT Downloader build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Which APK?**
            - `app-arm64-v8a-release.apk` → almost every phone (recommended)
            - `app-armeabi-v7a-release.apk` → old 32-bit phones
            - `app-universal-release.apk` → not sure? this works everywhere (bigger)
          files: app/build/outputs/apk/release/*.apk
